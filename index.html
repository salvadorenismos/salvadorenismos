<style>
  :root{
    color-scheme:light only;
    --ink:#1A1428;
    --blue:#0F47AF; --blue-lt:#3D7BE0; --blue-dk:#0A3179;
    --marigold:#F5B31B; --achiote:#E0402C; --verde:#2FA05A;
    --turq:#18B3C7; --purple:#8B46B5; --pink:#EE5D96;
    --adobe:#C9733A; --monte:#7FA82A;
    --paper:#FFF6E3; --paper-2:#F7E7C6; --white:#fff;
    --sh:5px 5px 0 var(--ink); --sh-sm:3px 3px 0 var(--ink); --bd:3px solid var(--ink);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overscroll-behavior-y:contain;background:#FFF6E3;color:#1A1428}
  body{
    background:var(--paper);color:var(--ink);
    font-family:'Karla',ui-sans-serif,system-ui,sans-serif;font-size:16px;line-height:1.5;
    /* 8-bit checker, kept faint so text stays readable */
    background-image:
      linear-gradient(45deg,rgba(15,71,175,.045) 25%,transparent 25%,transparent 75%,rgba(15,71,175,.045) 75%),
      linear-gradient(45deg,rgba(15,71,175,.045) 25%,transparent 25%,transparent 75%,rgba(15,71,175,.045) 75%);
    background-size:16px 16px;background-position:0 0,8px 8px;
  }
  #bg{position:fixed;inset:0;background:#FFF6E3;z-index:-2}
  #app{max-width:560px;margin:0 auto;padding:0 14px 96px;min-height:100vh;position:relative;z-index:1}
  h1,h2,h3,.display{font-family:'Bricolage Grotesque','Karla',sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1.08;margin:0}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:99}
  .ico{display:block;image-rendering:pixelated;flex:none}

  /* ---------- masthead ---------- */
  .mast{display:flex;align-items:center;gap:10px;padding:16px 2px 10px}
  .mast .flagbox{border:var(--bd);box-shadow:var(--sh-sm);line-height:0;background:var(--white)}
  .mast h1{font-size:23px;color:var(--blue);flex:1;line-height:1.05}
  .mast h1 small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink);opacity:.55;font-family:'Karla',sans-serif;margin-top:3px}
  .mute{border:var(--bd);background:var(--white);padding:6px 10px;font-size:12px;font-weight:700;
    box-shadow:var(--sh-sm);font-family:inherit}
  .mute:active{transform:translate(3px,3px);box-shadow:none}

  /* ---------- the scene, shared by Palabras and Mercado ---------- */
  .banner{position:relative;height:152px;border:var(--bd);box-shadow:var(--sh);
    background:#fff;overflow:hidden;margin-bottom:14px}
  .banner span{position:absolute;line-height:0}
  /* The sol is first in the markup, so it sits behind everything else and
     genuinely rises from behind the volcán and sets behind the church and
     flag. The 14px in the calc is half its width, to centre it on the arc. */
  /* The sol is first in the markup, so it sits behind everything else and
     genuinely rises from behind the volcán and sets behind the church and
     flag. The 13px in the calc is half its width, to centre it on the arc. */
  .banner .sol{animation:sunArc 26s steps(52) infinite}
  /* Everything on the ground is one flush row - no gaps. `rowin` is scaled
     by fitScene() so the row fills the banner at any width. */
  .banner .row{position:absolute;left:0;right:0;bottom:6px;
    display:flex;justify-content:center;align-items:flex-end}
  .banner .rowin{display:flex;align-items:flex-end;transform-origin:bottom center;
    position:relative}
  .banner .rowin>span{position:relative;line-height:0;flex:none}
  .banner .stack{position:relative}
  .banner .perch{position:absolute;left:50%;bottom:100%;margin-left:-7px}
  .banner .onstall{position:absolute;left:50%;bottom:5px;margin-left:-7px;
    animation:bob 1.8s steps(5) infinite}
  .banner .chucho{animation:jump 2.4s steps(4) infinite}
  /* she paces along the street, in front of everything */
  /* Must out-rank `.rowin>span` above, or she becomes a flex item at the
     end of the row instead of an overlay walking in front of it. */
  .banner .rowin>span.canasta{position:absolute;bottom:0;left:20%;z-index:3;
    animation:walk 7s steps(26) infinite alternate, face 14s steps(1) infinite}
  .banner .item{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:4;
    background:#fff;border:var(--bd);box-shadow:var(--sh-sm);padding:6px}
  @keyframes sunArc{
    0%  {left:calc(3%  - 14px); bottom:-8px}
    12% {left:calc(14% - 14px); bottom:36px}
    25% {left:calc(26% - 14px); bottom:72px}
    38% {left:calc(38% - 14px); bottom:93px}
    50% {left:calc(50% - 14px); bottom:100px}

/* Katie's drawings are unpacked here; the few hand-drawn grids fall through below. */
const A64="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_-";
const A64I={}; for(let i=0;i<A64.length;i++) A64I[A64[i]]=i;
function icon40(d,size,cls){
  let r="";
  for(let i=0;i<d.r.length;i+=4){
    r+='<rect x="'+A64I[d.r[i+1]]+'" y="'+A64I[d.r[i]]+'" width="'+A64I[d.r[i+2]]+
       '" height="1" fill="'+d.p[A64I[d.r[i+3]]]+'"/>';
  }
  /* Cropped to where the ink actually is, so a drawing has no invisible
     margin. size is the height; the width follows the drawing's shape. That
     is what lets the scene stand everything on one ground line. */
  const b=d.b, w=Math.max(1,Math.round(size*b[2]/b[3]));
  return '<svg class="ico '+(cls||"")+'" viewBox="'+b[0]+' '+b[1]+' '+b[2]+' '+b[3]+
         '" width="'+w+'" height="'+size+
         '" shape-rendering="crispEdges" aria-hidden="true" focusable="false">'+r+'</svg>';
}
function icon(name,size,cls){
  if(ART40[name]) return icon40(ART40[name],size,cls);
  const a=ART[name]; if(!a) return "";
  const h=a.length, w=a[0].length; let r="";
  for(let y=0;y<h;y++) for(let x=0;x<a[y].length;x++){
    const c=PX[a[y][x]];
    if(c) r+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+c+'"/>';
  }
  return '<svg class="ico '+(cls||"")+'" viewBox="0 0 '+w+' '+h+'" width="'+size+'" height="'+size+
         '" shape-rendering="crispEdges" aria-hidden="true" focusable="false">'+r+'</svg>';
}

/* ============ FX ============ */
const REDUCED = matchMedia("(prefers-reduced-motion:reduce)").matches;
const cv=document.getElementById("fx"), ctx=cv.getContext("2d");
let parts=[], raf=null;
const COLORS=["#F5B31B","#E0402C","#2FA05A","#0F47AF","#18B3C7","#EE5D96","#FFFFFF"];
function fit(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;
  cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";ctx.setTransform(d,0,0,d,0,0)}
fit(); addEventListener("resize",fit);

function burst(x,y,n,spread,dir,power){
  if(REDUCED) return;
  n=n||46; spread=spread||Math.PI*2; dir=dir===undefined?-Math.PI/2:dir; power=power||9;
  for(let i=0;i<n;i++){
    const a=dir+(Math.random()-.5)*spread, s=power*(.45+Math.random());
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      sz:4+((Math.random()*3)|0)*2, rot:0, vr:0,
      c:COLORS[(Math.random()*COLORS.length)|0],life:1});
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(function(p){
    p.vy+=.34; p.vx*=.992; p.vy*=.992; p.x+=p.vx; p.y+=p.vy; p.life-=.0085;
    if(p.life<=0||p.y>innerHeight+60) return false;
    ctx.globalAlpha=Math.min(1,p.life*1.8); ctx.fillStyle=p.c;
    /* square chunks, snapped to a grid — confetti as pixels */
    ctx.fillRect(Math.round(p.x/2)*2,Math.round(p.y/2)*2,p.sz,p.sz);
    return true;
  });
  if(parts.length) raf=requestAnimationFrame(tick);
  else {raf=null; ctx.clearRect(0,0,innerWidth,innerHeight)}
}
function cannons(){
  if(REDUCED) return;
  burst(0,innerHeight*.72,70,1.1,-Math.PI/3.4,17);
  burst(innerWidth,innerHeight*.72,70,1.1,-Math.PI+Math.PI/3.4,17);
  setTimeout(function(){burst(innerWidth*.5,innerHeight*.32,80,Math.PI*2,-Math.PI/2,12)},260);
}
function fromEl(el,n,power){
  const r=el.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2,n,Math.PI*2,-Math.PI/2,power||10);
}

let soundOn=true, ac=null;
function tone(freq,dur,type,vol){
  if(!soundOn) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"square"; o.frequency.value=freq;   /* square = chiptune */
    g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(vol||.09,ac.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+dur+.02);
  }catch(e){}
}
const chime=function(n){[523.25,659.25,783.99,1046.5].slice(0,2+Math.min(2,n)).forEach(function(f,i){
  setTimeout(function(){tone(f,.18,"square",.08)},i*68)})};
const thud=function(){tone(160,.18,"sawtooth",.07);setTimeout(function(){tone(110,.26,"sawtooth",.06)},70)};
const tap=function(){tone(880,.04,"square",.03)};
const fanfare=function(){[523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){

const buzz=function(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ============ PRÁCTICA ============ */
const QUIZ_WORDS = 12;   /* how many glossary questions in a round */
const QUIZ_VERBS = 6;    /* how many vos-form questions */

/* Four choices, every one of them different and none of them blank.
   Two guards live here. A verb like estar or ir has the same vos and tú
   form, so the tú form can't always be the wrong answer - the list is
   topped up from the rest of the pool instead of showing the same word
   twice. And anything empty is skipped, so a half-filled row can never
   put the word "undefined" on a button again. */
function options(correct, pool, n){
  const opts=[correct];
  shuffle(pool).forEach(function(o){
    if(opts.length<n && o && opts.indexOf(o)<0) opts.push(o);
  });
  return shuffle(opts);
}

function buildQuiz(){
  const pool=[];
  shuffle(WORDS.filter(function(x){return x.g})).slice(0,QUIZ_WORDS).forEach(function(x){
    pool.push({prompt:"What does this mean?",q:x.w,correct:x.g,
      opts:options(x.g, WORDS.filter(function(y){return y.id!==x.id})
        .map(function(y){return y.g}), 4)});
  });
  /* Command-only verbs have no present tense, so they sit this one out. */
  shuffle(VERBS.filter(function(v){return v.vos})).slice(0,QUIZ_VERBS).forEach(function(v){
    const wrong=[v.tu].concat(VERBS.filter(function(y){return y.id!==v.id})
      .map(function(y){return y.vos}));
    pool.push({prompt:"The vos form of…",q:v.inf,correct:v.vos,opts:options(v.vos,wrong,4)});
  });
  return {items:shuffle(pool),i:0,score:0,answered:null,streak:0,best:0};
}

function renderPractica(){
  if(!quiz) return renderStart();

  if(quiz.i>=quiz.items.length){
    const n=quiz.items.length, s=quiz.score, pct=Math.round(s/n*100);
    const msg = pct===100?"Perfect. Not one miss."
      : pct>=75?"Solid. Your family would follow every word of that."
      : pct>=50?"Getting there. Star the ones that tripped you."
      : "Early days. Run it again — the words repeat differently.";
    const win=pct>=75;
    view.innerHTML=
      '<div class="card rise" style="background:'+(win?"var(--verde)":"var(--paper-2)")+';'+
        (win?"color:#fff":"")+'">'+
        '<div class="prompt" style="'+(win?"color:rgba(255,255,255,.75)":"")+'">You got</div>'+
        '<div class="bignum" id="tally">0</div>'+
        '<div class="prompt" style="margin:8px 0 0;'+(win?"color:rgba(255,255,255,.75)":"")+
          '">out of '+n+' &nbsp;·&nbsp; best streak '+quiz.best+'</div>'+
        '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px">'+
          (win?icon("volcan",26)+icon("pupusa",26)+icon("estrella",26):icon("coffee",26))+'</div>'+
      '</div>'+
      '<p class="note" style="text-align:center;padding:0 6px 16px;font-size:14.5px">'+msg+'</p>'+
      '<button class="btn go wide" id="again">Go again</button>';
    const t=document.getElementById("tally"); let c=0;
    const step=setInterval(function(){
      c++; t.textContent=c; tone(440+c*45,.06,"square",.05);
      if(c>=s){clearInterval(step); t.classList.add("swell");
        if(win){cannons();fanfare();buzz([18,60,18,60,32])} else buzz(20)}
    },110);
    if(s===0) t.textContent="0";
    document.getElementById("again").onclick=function(){
      tone(659,.12,"square",.08);quiz=buildQuiz();renderPractica()};
    return;
  }

  const it=quiz.items[quiz.i], done=quiz.i+(quiz.answered!==null?1:0);
  view.innerHTML=
    '<div class="hud">'+
      '<div class="bar"><i style="width:'+(done/quiz.items.length*100)+'%"></i></div>'+
      '<span class="streak '+(quiz.streak?"":"cold")+'" id="strk">'+
        icon("estrella",13)+(quiz.streak||0)+'</span>'+
    '</div>'+
    '<div class="card slidein"><div class="prompt">'+it.prompt+'</div>'+
      '<div class="q">'+esc(it.q)+'</div></div>'+
    '<div class="opts">'+it.opts.map(function(o,n){
      let c="opt";
      if(quiz.answered!==null){
        if(o===it.correct) c+=" right";
        else if(n===quiz.answered) c+=" wrong";
        else c+=" dim";
      }
      return '<button class="'+c+'" data-n="'+n+'">'+esc(o)+'</button>';
    }).join("")+'</div>'+
    (quiz.answered!==null?
      '<div class="verdict rise" style="color:'+
        (it.opts[quiz.answered]===it.correct?"var(--verde)":"var(--achiote)")+'">'+quiz.verdict+'</div>'+
      '<button class="btn wide" id="next" style="margin-top:6px">Next</button>':'');

  if(quiz.answered===null){
    view.querySelectorAll(".opt").forEach(function(b){
      b.onclick=function(){
        const n=+b.dataset.n, ok=it.opts[n]===it.correct;
        quiz.answered=n;
        quiz.verdict = ok?pick(YES):pick(NO);
        if(ok){quiz.score++;quiz.streak++;quiz.best=Math.max(quiz.best,quiz.streak)}
        else quiz.streak=0;
        renderPractica();
        const chosen=view.querySelectorAll(".opt")[n];
        if(ok){
          chime(quiz.streak); buzz([14,40,14]);
          fromEl(chosen,30+Math.min(quiz.streak,5)*10,9+Math.min(quiz.streak,5));
          if(quiz.streak>=3){const st=document.getElementById("strk");
            st.classList.add("swell"); fromEl(st,16,7)}
        } else {
          thud(); buzz(90);
          chosen.classList.add("shake");
          document.querySelector(".card").classList.add("shake");
        }
      }});
  } else {
    document.getElementById("next").onclick=function(){
      tap();quiz.i++;quiz.answered=null;renderPractica()};
  }
}

function mercadoItems(){

/* Scale the row so it spans the banner at whatever width the app is.
   Watched with a ResizeObserver rather than the window resize event: that
   event fires before the layout reflows, so the width read back was stale
   and the row kept the previous size. */
function fitScene(){
  const ban=sceneEl.querySelector(".banner"), row=sceneEl.querySelector(".rowin");
  if(!ban||!row) return;
  const room=ban.clientWidth-10;
  if(room<40) return;                 /* hidden, or not laid out yet */
  row.style.transform="none";
  const natural=row.offsetWidth;
  if(natural>0) row.style.transform="scale("+Math.min(1.5, room/natural).toFixed(3)+")";
}

function renderMercado(){
  const pool=mercadoItems(), missing=missingMercado();
  const gapNote = missing.length
    ? '<div class="gap"><b>Not in the glossary yet:</b> '+esc(missing.join(", "))+
      '. Add them to words.csv and they join the market automatically.</div>' : '';

  if(!mercado){
    sceneItem(null);
    view.innerHTML =
      '<div class="askrow">'+
        '<span class="line">'+bi("Hi there! What's up? What can I get you?","¡Buenas! ¿Qué ondas? ¿Le sirvo algo?")+'</span></div>'+
      '<p class="note" style="padding:2px 2px 12px">Walk through the market and name what you see. '+
        pool.length+' things, drawn from your glossary.</p>'+
      gapNote+
      '<button class="btn go wide" id="mstart">'+icon("pupusa",20)+'Go to the market/Ir al mercado</button>';
    document.getElementById("mstart").onclick=function(){
      tone(659,.12,"square",.08);buzz(12);
      /* If a word ever has more than one picture, ask it once per round and
         vary which picture comes up. */
      const seen={}, round=[];
      shuffle(pool).forEach(function(m){ if(!seen[m.id]){seen[m.id]=1; round.push(m)} });
      mercado={items:round,i:0,score:0,answered:null,streak:0,best:0};
      renderMercado();
    };
    return;
  }

  if(mercado.i>=mercado.items.length){
    const n=mercado.items.length, sc=mercado.score, win=sc/n>=.75;
    sceneItem(null);
    view.innerHTML =
      '<div class="card rise" style="background:'+(win?"var(--verde)":"var(--paper-2)")+';'+
        (win?"color:#fff":"")+'">'+
        '<div class="prompt" style="'+(win?"color:rgba(255,255,255,.75)":"")+'">Nombraste</div>'+
        '<div class="bignum">'+sc+'</div>'+
        '<div class="prompt" style="margin:8px 0 0;'+(win?"color:rgba(255,255,255,.75)":"")+
          '">de '+n+' &nbsp;·&nbsp; racha '+mercado.best+'</div></div>'+
      '<div class="askrow"><span class="line">'+
        (win?bi("Done! Here they are, nice and hot.","¡Listo! Aquí están, bien calientitas."):
             bi("Come back any time!","Vení cuando querás."))+
        '</span></div>'+
      '<button class="btn go wide" id="magain">'+icon("pupusa",20)+'Otra vuelta</button>';
    if(win){cannons();fanfare();buzz([18,60,18,60,32])}
    document.getElementById("magain").onclick=function(){
      tone(659,.12,"square",.08); mercado=null; renderMercado()};
    return;
  }

  const it=mercado.items[mercado.i];
  if(mercado.answered===null){
    /* Wrong answers should be plausible: other things you'd see at the market
       first, then words from the same category, then anything. A picture of a
       chumpe shouldn't be up against "mi amor". */
    const self=it.id;
    const tagOf=function(id){const w=WORDS.filter(function(x){return x.id===id})[0];return w&&w.t};
    const mine=tagOf(self);
    const tiers=[
      mercadoItems().filter(function(m){return m.id!==self}).map(function(m){return m.w||m.word}),
      WORDS.filter(function(w){return w.id!==self&&w.t===mine}).map(function(w){return w.w}),
      WORDS.filter(function(w){return w.id!==self}).map(function(w){return w.w})
    ];
    const others=[];
    tiers.forEach(function(t){
      shuffle(t).forEach(function(w){
        if(others.length<3 && others.indexOf(w)<0 && w!==it.word) others.push(w);
      });
    });
    mercado.opts=shuffle([it.word].concat(others));
  }
  const done=mercado.i+(mercado.answered!==null?1:0);

  sceneItem(icon(it.art,52));
  view.innerHTML =
    '<div class="hud"><div class="bar"><i style="width:'+(done/mercado.items.length*100)+'%"></i></div>'+
      '<span class="streak '+(mercado.streak?"":"cold")+'">'+icon("estrella",13)+(mercado.streak||0)+'</span></div>'+
    '<div class="askrow">'+
      '<span class="line">'+bi("So, what's this then?","¿Y esto qué es, pues?")+'</span></div>'+
    '<div class="opts">'+mercado.opts.map(function(o,n){
      let c="opt";
      if(mercado.answered!==null){
        if(o===it.word) c+=" right";
        else if(n===mercado.answered) c+=" wrong";
        else c+=" dim";
      }
      return '<button class="'+c+'" data-n="'+n+'">'+esc(o)+'</button>';
    }).join("")+'</div>'+
    (mercado.answered!==null?
      '<div class="verdict rise" style="color:'+
        (mercado.opts[mercado.answered]===it.word?"var(--verde)":"var(--achiote)")+'">'+
        mercado.verdict+' — <span style="font-weight:400">'+esc(it.gloss)+'</span></div>'+
      '<button class="btn wide" id="mnext" style="margin-top:6px">Seguir</button>':'');

  if(mercado.answered===null){
    view.querySelectorAll(".opt").forEach(function(b){
      b.onclick=function(){
        const n=+b.dataset.n, ok=mercado.opts[n]===it.word;
        mercado.answered=n; mercado.verdict= ok?pick(YES):pick(NO);
        if(ok){mercado.score++;mercado.streak++;mercado.best=Math.max(mercado.best,mercado.streak)}
        else mercado.streak=0;
        renderMercado();
        const chosen=view.querySelectorAll(".opt")[n];
        if(ok){chime(mercado.streak);buzz([14,40,14]);fromEl(chosen,28,9)}
        else{thud();buzz(90);chosen.classList.add("shake")}
      }});
  } else {
    document.getElementById("mnext").onclick=function(){
      tap(); mercado.i++; mercado.answered=null; renderMercado()};
  }
}

/* ============ EL JUEGO ============
   A short side-scrolling platformer in the style of 1985 Mario. The lady
   with the basket runs right, collects pupusas, jumps the houses, climbs
   the volcán, bounces off the comal and finishes at the top of the
   pirámide. One touch from a chucho, or one hole, and the level restarts.

   It draws Katie's own pixel art on a canvas. Nothing new was drawn for
   it - every sprite is already in art/.

   THE LEVEL IS THE PICTURE BELOW. One character is one 24-pixel square,
   twelve rows tall, and you can redraw it freely:

       #  solid ground or block        o  a pupusa to collect
       =  a platform to stand on       C  the comal - bounces her high
       S  where she starts             d  a chucho patrols from here
       X  the top - flag and confetti  t  the torogoz, until she touches it
       .  empty air

   Holes are simply gaps in the bottom two rows. Everything else - the
   houses, the volcán, the pirámide - is drawn on top of the blocks by
   SCENERY below, so a shape you build here gets a picture over it. */
const T=24, VW=480, VH=288;          /* one square, and the window onto the level */
const LEVEL=[
  "..........................................................................................................................X.......",
  "..........................................................................................................................X.......",
  ".........................................................o................................................................X.......",
  "........................................o...............o.o...............................................................X.......",
  "........................................#...................o..............................................oto............X.......",
  ".......................................o#..................................................................===............#.......",
  "................oo.....ooo.............###....................o..............oo...oo..................ooo...............o###o.....",
  ".......................===............o###o...........................................................===...............#####.....",
  "................##....................#####................####..............##...##...........................o......o#######....",
  "..S...o.o.......##..oo...............#######.........o...C.####..............##...##......d...............d...........#########...",
  "###########..##################..################..####################..########################..##############..###############",
  "###########..##################..################..####################..########################..##############..###############"
];
const LROWS=LEVEL.length, LCOLS=LEVEL[0].length, LW=LCOLS*T;

/* Pictures laid over the blocks. x and y are in squares, h is the height
   in squares; the width follows the drawing's own shape. back:1 means it
   sits far off in the distance and drifts by more slowly. */
/* Pictures laid over the blocks. x and y are in squares, h is the height in
   squares; the width follows the drawing's own shape. back:1 puts a drawing
   in the far distance, where it drifts by at half speed. The landscape
   picture behind everything is drawn in gameDraw, not here. */
const SCENERY=[
  {art:"casa_adobe",   x:17,  y:10, h:2.7},
  {art:"volcan",       x:40,  y:10, h:6.7},
  {art:"catedral", x:61,  y:10, h:4.5},
  {art:"casa_gallina", x:78,  y:10, h:2.7},
  {art:"casa_hamaca",  x:83,  y:10, h:2.7},
  {art:"piramide",     x:122, y:10, h:6.2}
];

/* How she moves. Tuned so a normal jump clears three squares and the
   comal sends her seven, and so the three-square holes are comfortably
   jumpable at a run. */
/* How she moves. She gets a second jump in mid-air, and near the top of a
   jump gravity eases off so she hangs there a moment - that float is what
   carries her over a hole instead of dropping her into it. */
const GRAV=.42, RUN=.55, MAXRUN=3.0, FRICT=.82, MAXFALL=14;
const JUMP=8.8, JUMP2=7.4, BOUNCE=13;
const HANGV=2.4, HANGMUL=.5;     /* while |vy| is small, gravity is halved */
const PW=18, PH=30, DW=20, DH=18, DOGBEAT=T*2.2;

let game=null, gameRaf=null, keys={}, backCv=null, scene=null;

/* The landscape picture, backdrop.png, made by build.py from art/. A copy is
   laid mirrored beside it, so the picture can wrap while scrolling with no
   seam: the join at each edge matches itself. */
(function loadScene(){
  const im=new Image();
  im.onload=function(){
    const c=document.createElement("canvas");
    c.width=im.width*2; c.height=im.height;
    const k=c.getContext("2d");
    k.drawImage(im,0,0);
    k.save(); k.translate(c.width,0); k.scale(-1,1); k.drawImage(im,0,0); k.restore();
    scene=c;
  };
  im.src="backdrop.png";
})();
/* The end screen comes up a beat after she dies or wins. If the tab is left in
   that beat the game is already put away, so the pending call has to go too. */
let gameOverTimer=null;

function tileAt(c,r){
  if(r<0||r>=LROWS||c<0||c>=LCOLS) return ".";
  return LEVEL[r][c];
}
function solidAt(c,r){ const t=tileAt(c,r); return t==="#"||t==="="; }
function hits(x,y,w,h){
  if(x<0||x+w>LW) return true;                       /* the walls at either end */
  const c0=Math.floor(x/T), c1=Math.floor((x+w-1)/T);
  const r0=Math.floor(y/T), r1=Math.floor((y+h-1)/T);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(solidAt(c,r)) return true;
  return false;
}

/* Every drawing is redrawn once into its own little canvas - and once more
   mirrored, for when she walks the other way - then stamped from there. */
const SPR={};
function sprite(name,flip){
  const k=name+(flip?"|f":"");
  if(SPR[k]!==undefined) return SPR[k];
  const d=ART40[name];
  if(!d){ SPR[k]=null; return null }
  const b=d.b, w=b[2], h=b[3];
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const g=c.getContext("2d");
  for(let i=0;i<d.r.length;i+=4){
    const ry=A64I[d.r[i]]-b[1], rx=A64I[d.r[i+1]]-b[0], rw=A64I[d.r[i+2]];
    g.fillStyle=d.p[A64I[d.r[i+3]]];
    g.fillRect(flip? w-rx-rw : rx, ry, rw, 1);
  }
  SPR[k]=c; return c;
}
/* Stamp a drawing with its feet at (cx, baseY) and the given height. */
function blit(g,name,cx,baseY,hPx,flip){
  const s=sprite(name,flip); if(!s) return;
  const w=Math.max(1,Math.round(hPx*s.width/s.height));
  g.drawImage(s, Math.round(cx-w/2), Math.round(baseY-hPx), w, Math.round(hPx));
}

function newGame(){
  const g={x:0,y:0,vx:0,vy:0,face:1,onGround:0,coyote:0,buffer:0,cut:0,jumps:0,
    cam:0,score:0,pupusas:[],dogs:[],won:0,dead:0,t:0,comal:0,win:null};
  for(let r=0;r<LROWS;r++) for(let c=0;c<LCOLS;c++){
    const t=LEVEL[r][c];
    if(t==="S"){ g.x=c*T+(T-PW)/2; g.y=r*T+T-PH; }
    else if(t==="o") g.pupusas.push({x:c*T+T/2, y:r*T+T/2, got:0, bob:(c*7+r*13)%60});
    else if(t==="d") g.dogs.push({x:c*T+2, y:r*T+T-DH, dir:-1, home:c*T+2});
    else if(t==="X") g.win={x:c*T+T/2, y:r*T+T/2};
    else if(t==="t") g.bird={x:c*T+T/2, y:r*T+T/2, gone:0, vx:0, vy:0, flap:0};
  }
  g.total=g.pupusas.length;
  return g;
}

function gameStep(){
  const g=game; g.t++;
  if(g.won){ g.wt++; return }

  /* ---- her ---- */
  const left=keys.left, right=keys.right;
  if(left&&!right){ g.vx-=RUN; g.face=-1 }
  else if(right&&!left){ g.vx+=RUN; g.face=1 }
  else g.vx*=FRICT;
  if(g.vx>MAXRUN) g.vx=MAXRUN; if(g.vx<-MAXRUN) g.vx=-MAXRUN;
  if(Math.abs(g.vx)<.06) g.vx=0;

  if(g.buffer>0) g.buffer--;
  if(g.coyote>0) g.coyote--;
  if(g.buffer){
    if(g.coyote){                                  /* off the ground */
      g.vy=-JUMP; g.jumps=1; g.buffer=0; g.coyote=0; g.onGround=0; g.cut=1;
      tone(523,.09,"square",.06);
    } else if(g.jumps<2){                          /* the second one, in mid-air */
      g.vy=-JUMP2; g.jumps=2; g.buffer=0; g.cut=1;
      tone(659,.08,"square",.055);
      setTimeout(function(){tone(880,.08,"square",.045)},55);
      buzz(10);
    }
  }
  /* Let go of jump early and she doesn't go as high. Only her own jumps get
     cut short like this - a bounce off the comal always goes its full height,
     or she could never reach the pupusas stacked above it. */
  if(g.cut && !keys.jump && g.vy<-3){ g.vy=-3; g.cut=0 }

  /* Gravity eases off around the top of the arc, so she hangs a moment and
     carries further. Without it a jump is a sharp triangle and a hole is far
     too easy to drop into. */
  g.vy += GRAV * (Math.abs(g.vy)<HANGV ? HANGMUL : 1);
  if(g.vy>MAXFALL) g.vy=MAXFALL;

  /* Move on one axis, then put her back flush against the square she ran
     into - snapped exactly to its edge, not nudged back a pixel at a time.
     Nudging left her a fraction of a pixel above the ground on alternate
     frames, so "is she standing on something" flickered on and off and the
     jump timing went with it. */
  g.x+=g.vx;
  if(hits(g.x,g.y,PW,PH)){
    g.x = g.vx>0 ? Math.floor((g.x+PW)/T)*T-PW : Math.floor(g.x/T)*T+T;
    g.vx=0;
  }
  if(g.x<0) g.x=0;

  g.y+=g.vy;
  /* A ceiling a square above the picture. A double jump from the top of the
     pirámide would otherwise carry her clean off the top of the screen, out
     of sight and past the finish. */
  if(g.y<-T){ g.y=-T; g.vy=0 }
  if(hits(g.x,g.y,PW,PH)){
    if(g.vy>0) g.y=Math.floor((g.y+PH)/T)*T-PH;
    else g.y=Math.floor(g.y/T)*T+T;
    g.vy=0;
  }
  /* Whether she is standing on something is a separate question, asked with
     a one-pixel probe under her feet. When she lands, her feet sit exactly on
     the line and the collision test alone reports mid-air - so she flickered
     between standing and falling every frame, and the jump went with it. */
  g.onGround = hits(g.x,g.y+1,PW,PH) ? 1 : 0;
  if(g.onGround){
    g.coyote=6;
    /* Park her exactly on the line. Gravity still pulls while she is standing
       there, and although it is never enough to register as a collision it was
       sinking her a fraction of a pixel a frame and snapping her back - a
       twitch about twelve times a second that read as her being jittery. */
    if(g.vy>0){ g.vy=0; g.y=Math.floor((g.y+PH)/T)*T-PH }
  }
  /* Landing gives both jumps back. Walking off a ledge spends the first one
     once the coyote grace is gone, so stepping into a hole still leaves her
     the mid-air jump to save herself - but not two. */
  if(g.onGround) g.jumps=0;
  else if(g.jumps===0 && g.coyote===0) g.jumps=1;

  /* ---- the comal sends her up ---- */
  const c0=Math.floor(g.x/T), c1=Math.floor((g.x+PW-1)/T);
  const r0=Math.floor(g.y/T), r1=Math.floor((g.y+PH-1)/T);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    if(tileAt(c,r)==="C" && g.vy>=0){
      g.vy=-BOUNCE; g.comal=10; g.coyote=0; g.cut=0; g.jumps=1;
      tone(392,.07,"square",.07); setTimeout(function(){tone(784,.12,"square",.07)},60);
      buzz(14);
    }
  }

  /* ---- pupusas ---- */
  g.pupusas.forEach(function(p){
    if(p.got) return;
    if(Math.abs(p.x-(g.x+PW/2))<15 && Math.abs(p.y-(g.y+PH/2))<20){
      p.got=1; g.score++;
      tone(880+g.score*12,.07,"square",.06);
      setTimeout(function(){tone(1320,.08,"square",.05)},50);
    }
  });

  /* ---- chuchos, pacing their own patch of ground ---- */
  g.dogs.forEach(function(d){
    if(d.kicked){                      /* tumbling away after a stomp */
      d.x+=d.vx; d.y+=d.vy; d.vy+=.5; d.spin+=.4;
      return;
    }
    d.x+=d.dir*.85;
    const ahead=Math.floor((d.x+(d.dir>0?DW+1:-1))/T);
    const foot=Math.floor((d.y+DH+2)/T), body=Math.floor((d.y+DH-6)/T);
    /* It turns at a wall or the edge of its ground, and in any case keeps to
       a few squares either side of where it started - a chucho that paced the
       whole stretch could never be waited out. */
    if(!solidAt(ahead,foot)||solidAt(ahead,body)||Math.abs(d.x-d.home)>DOGBEAT) d.dir*=-1;

    if(!(g.x<d.x+DW-3 && g.x+PW>d.x+3)) return;        /* not alongside it */
    /* Coming down on its head kicks it off the screen and bounces her. Meeting
       it any other way - walking into it, clipping it on the way up - is the
       end of the run. */
    if(g.vy>0 && g.y+PH < d.y+DH*.7 && g.y+PH > d.y-6){
      d.kicked=1; d.vx=(g.vx>=0?1:-1)*3.4; d.vy=-7; d.spin=0;
      g.vy=-JUMP*.72; g.cut=1; g.jumps=1;
      tone(180,.1,"square",.07);
      setTimeout(function(){tone(1046,.14,"square",.06)},70);
      buzz([14,40,14]);
      return;
    }
    if(g.y<d.y+DH-2 && g.y+PH>d.y+4) die();
  });

  /* ---- the torogoz takes off when she reaches it ---- */
  if(g.bird){
    const b=g.bird;
    if(b.gone){ if(b.y>-400){ b.x+=b.vx; b.y+=b.vy; b.vy-=.035; b.flap++ } }
    /* matched to the box the bird is actually drawn in, so brushing past it
       is enough - it shouldn't need a direct hit */
    else if(g.x < b.x+14 && g.x+PW > b.x-14 && g.y < b.y+12 && g.y+PH > b.y-14){
      b.gone=1; b.vx=2.1; b.vy=-2.4; b.flap=0;
      tone(1568,.07,"square",.05);
      setTimeout(function(){tone(2093,.07,"square",.045)},70);
      setTimeout(function(){tone(1760,.1,"square",.04)},145);
    }
  }

  if(g.y>VH+60) die();                     /* down a hole */

  /* ---- the top of the pirámide ----
     Checked as an overlap with the whole square rather than a point, so she
     can't sail over the summit mid-jump and miss the end of the level. */
  let atTop=false;
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(tileAt(c,r)==="X") atTop=true;
  if(g.win && !g.won && atTop){
    g.won=1; g.wt=0; musicStop();
    fanfare(); cannons(); buzz([18,60,18,60,32]);
    const best=Math.max(g.score, parseInt(store.get("juego-best")||"0",10));
    store.set("juego-best",String(best));
    gameOverTimer=setTimeout(gameOver,900);
  }

  /* ---- the camera trails her, and stops at the ends ---- */
  const want=g.x+PW/2-VW*.42;
  g.cam+=(want-g.cam)*.12;
  if(g.cam<0) g.cam=0;
  if(g.cam>LW-VW) g.cam=LW-VW;
  if(g.comal>0) g.comal--;
}

function die(){
  if(game.dead||game.won) return;
  game.dead=1; musicStop();
  thud(); tone(196,.4,"sawtooth",.07); buzz([30,50,30]);
  gameOverTimer=setTimeout(gameOver,700);
}

function gameDraw(){
  const g=game, x=gameCtx; if(!x) return;
  const cam=Math.round(g.cam);

  /* sky and far country: the Salvadoran landscape picture, scrolling at half
     speed and wrapping by mirroring so there is never a seam. Until it has
     loaded, the plain sky gradient shows instead. */
  if(scene){
    const sh=scene.height, m=Math.floor(g.cam*.5) % scene.width;
    const first=Math.min(VW, scene.width-m);
    x.drawImage(scene, m, 0, first, sh, 0, 0, first, sh);
    if(first<VW) x.drawImage(scene, 0, 0, VW-first, sh, first, 0, VW-first, sh);
    x.fillStyle="#1b4636"; x.fillRect(0, sh, VW, VH-sh);   /* the picture's own bottom edge */
  } else {
    const sky=x.createLinearGradient(0,0,0,VH);
    sky.addColorStop(0,"#2E9BD6"); sky.addColorStop(.62,"#7FD0EC"); sky.addColorStop(1,"#CFEEF8");
    x.fillStyle=sky; x.fillRect(0,0,VW,VH);
  }

  /* the sol, riding along with her */
  const prog=LW>VW ? g.cam/(LW-VW) : 0;
  blit(x,"sol", 66+prog*(VW-132), 62-Math.sin(prog*Math.PI)*20, 30, 0);

  /* Far-off scenery drifts by at half speed. Its x is still written in
     squares of the level, so "paisaje at 68" means she sees it when she is
     around there - hence the halving here as well as on the camera. Without
     that second halving everything past about square 40 sat off to the right
     and was never seen at all. */
  /* The far valley is drawn whole onto its own canvas first and only then
     faded in. The hills overlap, so drawing each one straight onto the sky at
     55% would leave darker seams where two of them meet. */
  if(!backCv){ backCv=document.createElement("canvas"); backCv.width=VW; backCv.height=VH; }
  const bx=backCv.getContext("2d");
  bx.clearRect(0,0,VW,VH);
  SCENERY.forEach(function(s){
    if(!s.back) return;
    const px = s.x*T*.5 + VW/4 - cam*.5;
    if(px<-220||px>VW+220) return;
    blit(bx,s.art, px, s.y*T, s.h*T, 0);
  });
  x.globalAlpha=.55;
  x.drawImage(backCv,0,0);
  x.globalAlpha=1;

  /* blocks */
  const cFrom=Math.floor(cam/T), cTo=Math.ceil((cam+VW)/T);
  for(let r=0;r<LROWS;r++) for(let c=cFrom;c<=cTo;c++){
    const t=tileAt(c,r);
    if(t!=="#"&&t!=="=") continue;
    const px=c*T-cam, py=r*T;
    if(t==="="){
      x.fillStyle="#F5B31B"; x.fillRect(px,py,T,T-8);
      x.fillStyle="#1A1428"; x.fillRect(px,py,T,3); x.fillRect(px,py+T-11,T,3);
    } else {
      x.fillStyle=solidAt(c,r-1)?"#9E6B33":"#C08A4A"; x.fillRect(px,py,T,T);
      if(!solidAt(c,r-1)){ x.fillStyle="#2FA05A"; x.fillRect(px,py,T,5);
        x.fillStyle="#1A1428"; x.fillRect(px,py,T,3) }
      x.fillStyle="rgba(26,20,40,.16)"; x.fillRect(px,py+T-3,T,3); x.fillRect(px+T-3,py,3,T);
    }
  }

  /* the houses, the volcán and the pirámide, over the blocks they stand on */
  SCENERY.forEach(function(s){
    if(s.back) return;
    blit(x,s.art, s.x*T-cam, s.y*T, s.h*T, 0);
  });

  /* the comal she bounces off */
  for(let r=0;r<LROWS;r++) for(let c=cFrom;c<=cTo;c++){
    if(tileAt(c,r)!=="C") continue;
    const squash=g.comal>0?4:0;
    blit(x,"comal", c*T+T/2-cam, (r+1)*T, 20-squash, 0);
    blit(x,"pupusa", c*T+T/2-cam, (r+1)*T-16+squash, 11, 0);
  }

  /* pupusas, bobbing */
  g.pupusas.forEach(function(p){
    if(p.got) return;
    const bob=Math.sin((g.t+p.bob)/11)*3;
    blit(x,"pupusa", p.x-cam, p.y+8+bob, 16, 0);
  });

  /* chuchos, including any tumbling away after a stomp */
  g.dogs.forEach(function(d){
    if(d.kicked){
      if(d.y>VH+80) return;
      x.save();
      x.translate(Math.round(d.x+DW/2-cam), Math.round(d.y+DH/2));
      x.rotate(d.spin);
      blit(x,"chucho", 0, 11, 22, d.vx>0?1:0);
      x.restore();
      return;
    }
    blit(x,"chucho", d.x+DW/2-cam, d.y+DH+2, 22, d.dir>0?1:0);
  });

  /* the torogoz, sitting still until she reaches it, then away */
  if(g.bird){
    const b=g.bird, bx=b.x-cam;
    if(!(b.gone && (bx<-60||b.y<-60))){
      const lift=b.gone?Math.sin(b.flap/3)*3:0;
      blit(x,"torogoz", bx, b.y+9+lift, 20, b.gone?1:0);
    }
  }

  /* the flag at the top, once she gets there */
  if(g.won && g.win){
    const up=Math.min(1,g.wt/16);
    blit(x,"bandera", g.win.x-cam, g.win.y+6-up*34, 30, 0);
  }

  /* her */
  if(!g.dead){
    const run=g.onGround&&Math.abs(g.vx)>.4;
    const lean=run?Math.sin(g.t/4)*2:0;
    const air=g.onGround?0:2;
    blit(x,"canasta", g.x+PW/2-cam, g.y+PH+2+lean+air, 34, g.face<0?1:0);
  }

  /* score, drawn as part of the picture so it scales with it */
  x.fillStyle="rgba(26,20,40,.72)"; x.fillRect(8,8,108,26);
  blit(x,"pupusa", 24, 29, 15, 0);
  x.fillStyle="#FFF6E3"; x.font="700 15px Karla, sans-serif"; x.textBaseline="middle";
  x.fillText(g.score+" / "+g.total, 40, 22);
}

/* ---------- a little cumbia, made of square waves ----------
   A bass on the downbeats, a scraped güira on the offbeats and a melody
   over the top, in A minor. It loops until she wins or falls. */
let musicTimer=null, musicNoise=null;
const CUMBIA_BASS=[110,0,165,0, 110,0,147,0, 98,0,147,0, 110,0,130.8,0];
const CUMBIA_TUNE=[
  440,0,523.25,587.33, 659.25,0,587.33,0, 523.25,0,440,0, 392,0,440,0,
  523.25,0,659.25,0, 698.46,0,659.25,587.33, 523.25,0,493.88,0, 440,0,0,0
];
function noiseBuf(){
  if(musicNoise) return musicNoise;
  const n=Math.floor(ac.sampleRate*.06), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  musicNoise=b; return b;
}
function guira(t){
  const s=ac.createBufferSource(), g=ac.createGain(), f=ac.createBiquadFilter();
  s.buffer=noiseBuf(); f.type="highpass"; f.frequency.value=4200;
  g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.05);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t+.07);
}
function blip(freq,t,dur,type,vol){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.02);
}
function musicStart(){
  if(!soundOn||REDUCED) return;
  musicStop();
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
  }catch(e){ return }
  const step=60/96/2;                       /* eighth notes at 96bpm */
  let at=ac.currentTime+.12, i=0;
  musicTimer=setInterval(function(){
    if(!soundOn||!game||game.dead||game.won){ musicStop(); return }
    while(at < ac.currentTime+.35){
      const b=CUMBIA_BASS[i%CUMBIA_BASS.length], m=CUMBIA_TUNE[i%CUMBIA_TUNE.length];
      if(b) blip(b,at,.2,"square",.05);
      if(m) blip(m,at,.16,"square",.035);
      if(i%2===1) guira(at);                /* the offbeat scrape */
      if(i%8===0) blip(220,at,.1,"triangle",.05);
      at+=step; i++;
    }
  },60);
}
function musicStop(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null } }

/* ---------- the loop, and getting in and out cleanly ---------- */
let gameCtx=null;
function gameLoop(){
  if(!game||!gameCtx){ gameRaf=null; return }
  if(!game.dead&&!game.won) gameStep(); else if(game.won) game.wt++;
  gameDraw();
  gameRaf=requestAnimationFrame(gameLoop);
}
function gameStop(){
  if(gameRaf){ cancelAnimationFrame(gameRaf); gameRaf=null }
  if(gameOverTimer){ clearTimeout(gameOverTimer); gameOverTimer=null }
  musicStop(); game=null; gameCtx=null; keys={};
  removeEventListener("keydown",onKeyDown); removeEventListener("keyup",onKeyUp);
}
const KEYMAP={ArrowLeft:"left",ArrowRight:"right",KeyA:"left",KeyD:"right",
  Space:"jump",ArrowUp:"jump",KeyW:"jump"};
function onKeyDown(e){
  const k=KEYMAP[e.code]; if(!k) return;
  e.preventDefault();
  if(k==="jump"&&!keys.jump&&game) game.buffer=7;
  keys[k]=1;
}
function onKeyUp(e){ const k=KEYMAP[e.code]; if(!k) return; e.preventDefault(); keys[k]=0 }
/* the same three controls as buttons, for a phone */
function holdBtn(el,k){
  if(!el) return;
  const down=function(e){ e.preventDefault(); if(k==="jump"&&game) game.buffer=7; keys[k]=1 };
  const up=function(e){ e.preventDefault(); keys[k]=0 };
  el.addEventListener("touchstart",down,{passive:false});
  el.addEventListener("touchend",up); el.addEventListener("touchcancel",up);
  el.addEventListener("mousedown",down); el.addEventListener("mouseup",up);
  el.addEventListener("mouseleave",up);
}

function renderJuego(){ juego(null) }

function gameOver(){ gameOverTimer=null; if(!game) return; juego(game.won?"won":"lost") }

/* Game copy is English first, then Spanish, the same as the tabs. */
function bi(en,es){return '<span class="bi"><span class="en">'+en+'</span><span class="es">'+es+'</span></span>'}
function juego(screen){
  const best=parseInt(store.get("juego-best")||"0",10);

  if(screen==="play"){
    gameStop();
    view.innerHTML=
      '<div class="gamewrap">'+
        '<canvas id="gamecv" width="'+VW+'" height="'+VH+'" '+
          'aria-label="El Camino — a platform game"></canvas></div>'+
      '<div class="pad">'+
        '<button class="padbtn" id="padl" aria-label="Left">◀</button>'+
        '<button class="padbtn" id="padr" aria-label="Right">▶</button>'+
        '<button class="padbtn jump" id="padj" aria-label="Jump">JUMP/SALTAR</button></div>'+
      '<p class="note" style="padding:10px 2px 0;text-align:center">'+
        '← → walk/caminar · space jump/saltar · twice, double jump/dos veces, salto doble</p>';
    const cv=document.getElementById("gamecv");
    gameCtx=cv.getContext("2d");
    gameCtx.imageSmoothingEnabled=false;
    game=newGame();
    keys={};
    addEventListener("keydown",onKeyDown); addEventListener("keyup",onKeyUp);
    holdBtn(document.getElementById("padl"),"left");
    holdBtn(document.getElementById("padr"),"right");
    holdBtn(document.getElementById("padj"),"jump");
    cv.focus&&cv.focus();
    musicStart();
    if(!gameRaf) gameRaf=requestAnimationFrame(gameLoop);
    return;
  }

  if(screen){
    const g=game, won=screen==="won";
    gameStop();
    view.innerHTML=
      '<div class="card rise" style="background:'+(won?"var(--verde)":"var(--paper-2)")+';'+
        (won?"color:#fff":"")+'">'+
        '<div class="prompt" style="'+(won?"color:rgba(255,255,255,.75)":"")+'">'+
          (won?bi("You made it!","¡Llegaste!"):bi("Oops!","¡Puchica!"))+'</div>'+
        '<div class="bignum">'+g.score+'</div>'+
        '<div class="prompt" style="margin:8px 0 0;'+(won?"color:rgba(255,255,255,.75)":"")+'">'+
          (won?"of "+g.total+" pupusas/pupusas de "+g.total:"pupusas — start over/empezá otra vez")+
          (best?' &nbsp;·&nbsp; Best/Mejor '+best:'')+'</div>'+
        '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px">'+
          (won?icon("bandera",26)+icon("pupusa",26)+icon("estrella",26):icon("chucho",26))+'</div>'+
      '</div>'+
      '<p class="note" style="text-align:center;padding:0 6px 16px;font-size:14.5px">'+
        (won?bi("You made it to the top of the pirámide.","Subiste hasta la punta de la pirámide."):
             bi("A hole or a chucho and the level starts over.","Un hoyo o un chucho y el nivel vuelve a empezar."))+'</p>'+
      '<button class="btn go wide" id="jagain">Again/Otra vez</button>';
    if(won) cannons();
    document.getElementById("jagain").onclick=function(){tone(659,.12,"square",.08);buzz(12);juego("play")};
    return;
  }

  view.innerHTML=
    '<div class="card rise" style="background:var(--blue);color:var(--paper)">'+
      '<div class="prompt" style="color:rgba(255,255,255,.7)">'+bi("Run, jump, collect pupusas","Corré, saltá, juntá pupusas")+'</div>'+
      '<div class="hero" style="color:var(--marigold)">'+icon("canasta",40,"bob")+
        '<span>El Camino</span></div></div>'+
    '<button class="btn go wide" id="jstart">'+icon("pupusa",20)+'Start/Empezar</button>'+
    '<div class="panel rise" style="padding:12px 14px">'+
      '<p style="margin:0 0 8px;font-size:14.5px"><b>Arrow keys</b> ← → to walk, '+
      '<b>space bar</b> to jump. Tap it <b>twice</b> for a second jump in the air. On a phone, use the buttons.</p>'+
      '<p style="margin:0 0 8px;font-size:14.5px">Land <b>on top of</b> a chucho and it flies off. '+
      'Touch it any other way and the run is over.</p>'+
      '<p style="margin:0 0 12px;font-size:14.5px">Jump the houses, climb the volcán, bounce off the comal. '+
      'A hole and you start again at the beginning.</p>'+
      '<div style="border-top:0.5px solid rgba(0,0,0,.15);padding-top:10px">'+
      '<p style="margin:0 0 8px;font-size:13px;opacity:.78"><b>Las flechas</b> ← → para caminar, '+
      '<b>la barra espaciadora</b> para saltar. Tocala <b>dos veces</b> y da un '+
      'segundo salto en el aire. En el teléfono, usá los botones.</p>'+
      '<p style="margin:0 0 8px;font-size:13px;opacity:.78">Caéle <b>encima</b> a un chucho y '+
      'sale volando. Tocalo de cualquier otra manera y se acabó.</p>'+
      '<p style="margin:0;font-size:13px;opacity:.78">Saltá sobre las casas, subí el volcán, rebotá en el comal. '+
      'Un hoyo y volvés al principio.</p></div></div>'+
    (best?'<p class="note" style="text-align:center;padding:12px 2px">Best/Mejor: '+best+' pupusas</p>':'');
  document.getElementById("jstart").onclick=function(){
    tone(659,.12,"square",.08); buzz(12); juego("play")};
}

/* ============ SHELL ============ */
const TABS=[["palabras","Words/Palabras"],["vos","Vos"],["practica","Practice/Práctica"],
  ["mercado","Market/Mercado"],["juego","Pupusa Game/Juego de pupusas"]];
function renderTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(function(t){
    return '<button data-tab="'+t[0]+'" aria-current="'+(tab===t[0])+'">'+
      t[1].split("/").map(function(s,i){return '<span class="'+(i?"es":"en")+'">'+s+'</span>'}).join("")+
      '</button>'}).join("");
  document.querySelectorAll("nav button").forEach(function(b){
    b.onclick=function(){
      if(tab===b.dataset.tab) return;
      tap(); buzz(8); tab=b.dataset.tab; renderTabs(); render();
    }});
}
function render(){
  /* The game owns a canvas, a keyboard and a loop of music. Leaving the tab
     has to put all three down, or it keeps running behind the glossary. */
  if(tab!=="juego") gameStop();
  showScene(tab==="palabras"||tab==="mercado");
  if(tab==="palabras") renderPalabras();
  else if(tab==="vos") renderVos();
  else if(tab==="mercado") renderMercado();
  else if(tab==="juego") renderJuego();
  else renderPractica();
  scrollTo(0,0);
}
/* Same again if the phone is locked or the app is put in the background. */
addEventListener("visibilitychange",function(){ if(document.hidden) musicStop() });
document.getElementById("mastflag").innerHTML=icon("flag",30);
document.getElementById("mute").onclick=function(e){
  soundOn=!soundOn; e.target.textContent=soundOn?"Sound on":"Sound off";
  if(soundOn) tone(784,.1,"square",.08);
};
loadSaved();
sceneEl.innerHTML=banner();
fitScene();
/* Watch the real box, not the window resize event - that fires before the
   layout reflows, so the width read back was stale. */
if(window.ResizeObserver) new ResizeObserver(fitScene).observe(sceneEl);
else addEventListener("resize",fitScene);
renderTabs();
render();

/* ============ INSTALL / OFFLINE ============ */
if("serviceWorker" in navigator){
  addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
let deferredPrompt=null;
addEventListener("beforeinstallprompt",function(e){
  e.preventDefault(); deferredPrompt=e; showInstall();
});
function dismissedInstall(){ return store.get("install-dismissed")==="1" }
/* navigator.standalone is the iPhone's own answer; the media query is
   everyone else's. Either one means it is already installed. */
function installedAlready(){
  return navigator.standalone===true ||
    matchMedia("(display-mode: standalone)").matches;
}
function isApple(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);   /* iPadOS */
}
function showInstall(){
  if(dismissedInstall()||document.getElementById("installbar")) return;
  if(installedAlready()) return;
  const d=document.createElement("div");
  d.className="install"; d.id="installbar";
  d.innerHTML=icon("flag",30)+
    '<div class="body"><b>Add to your home screen</b>Works offline once installed.</div>'+
    '<button id="doinstall">Install</button>'+
    '<button class="x" id="noinstall" aria-label="Dismiss">✕</button>';
  document.getElementById("app").insertBefore(d,view);
  document.getElementById("doinstall").onclick=function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function(){
      deferredPrompt=null; d.remove();
    });
  };
  document.getElementById("noinstall").onclick=function(){
    store.set("install-dismissed","1"); d.remove();
  };
}

/* An iPhone never fires beforeinstallprompt - Safari has no such event and
   no Install button to offer. So an iPhone visitor was shown nothing at all
   and had no way to know this could live on their home screen, which is most
   of the point of the app. Safari's own Share menu is the only route there,
   so say so in words. */
function showAppleInstall(){
  if(!isApple()) return;
  if(dismissedInstall()||document.getElementById("installbar")) return;
  if(installedAlready()) return;
  const d=document.createElement("div");
  d.className="install"; d.id="installbar";
  d.innerHTML=icon("flag",30)+
    '<div class="body"><b>Add it to your home screen</b>'+
    'Tap <b style="display:inline">Share</b> — the square with the arrow '+
    'coming out of it — then <b style="display:inline">Add to Home Screen</b>. '+
    'It works with no signal once it is there.</div>'+
    '<button class="x" id="noinstall" aria-label="Dismiss">✕</button>';
  document.getElementById("app").insertBefore(d,view);
  document.getElementById("noinstall").onclick=function(){
    store.set("install-dismissed","1"); d.remove();
  };
}
if(isApple()) addEventListener("load",showAppleInstall);
</script>
